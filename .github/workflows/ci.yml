# Continuous integration: the same commands the README tells a contributor to run.
#
# Two independent jobs, one per package, with no shared state (each fetches its own copy of the two public portfolio repositories). Nothing here needs
# a secret, an API key or a database server: the server's tests run on an in-memory
# SQLite database (Node's built-in driver) and the model is a deterministic mock.
#
# THE PORTFOLIO PARITY SUITE RUNS HERE, AND MAY NOT SKIP
#
# server/test/demo-parity.test.ts compares this pipeline against the demo runner that
# lives in the sameer-3d-portfolio and portfolio repositories, and one web test reads the
# portfolio's project data. A standalone clone does not have them, so there those tests
# report as skipped, not failed: nothing is faked to make them run. CI is not a standalone
# clone. Each job checks both repositories out beside this one before testing
# (.github/scripts/checkout-portfolio-repos.sh: the branch of the same name if there is
# one, otherwise main), so the full count runs with nothing skipped, and when the CI
# environment variable is set a missing sibling is a failure, not a skip.
#
# Pushes to any branch run this, as do pull requests.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (test, typecheck, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # package.json "engines" requires Node >= 24: native TypeScript
          # type stripping and node:sqlite are what the server runs on.
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: bash ../.github/scripts/checkout-portfolio-repos.sh
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint

  web:
    name: Web (test, typecheck, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: bash ../.github/scripts/checkout-portfolio-repos.sh
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
