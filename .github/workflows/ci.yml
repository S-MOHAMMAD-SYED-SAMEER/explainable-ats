# Continuous integration: the same commands the README tells a contributor to run.
#
# Two independent jobs, one per package, with no shared state. Nothing here needs
# a secret, an API key or a database server: the server's tests run on an in-memory
# SQLite database (Node's built-in driver) and the model is a deterministic mock.
#
# THE PORTFOLIO PARITY SUITE SKIPS HERE, ON PURPOSE
#
# server/test/demo-parity.test.ts compares this pipeline against the demo runner
# that lives in the separate sameer-3d-portfolio repository. That checkout is not
# present on a CI runner, so those tests report as skipped, not failed — nothing is
# faked to make them run. The logic that decides whether the fixture exists IS
# tested here (server/test/portfolio-fixture.test.ts). To run the parity suite,
# check the portfolio out next to this repository, or set PORTFOLIO_DEMO_DIR, and
# run `npm test` in server/ — see the README.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (test, typecheck, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # package.json "engines" requires Node >= 24: native TypeScript
          # type stripping and node:sqlite are what the server runs on.
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint

  web:
    name: Web (test, typecheck, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
